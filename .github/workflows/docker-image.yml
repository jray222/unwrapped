# Tests every pull request, and on every merge to main publishes the Docker
# image to GitHub's container registry: ghcr.io/jray222/unwrapped:latest (plus a
# sha-<commit> tag to roll back to). The server's stack pulls that image (see
# README).
#
# There is no nightly test run. base-image-update.yml checks daily whether the
# base image (node:22-bookworm-slim) has a new version and, only then, starts this
# workflow to rebuild and publish. The base digest is stored as an image label.
name: Test and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Any base branch: pull requests here are often stacked on each other.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  BASE_IMAGE: node:22-bookworm-slim

jobs:
  tests:
    name: Backend and security tests (RLS + Surprise Rule)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  smoke:
    name: Production stack smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test production docker-compose.yml in an isolated directory
        run: |
          docker build --target prod -t ghcr.io/jray222/unwrapped:latest .
          mkdir -p /tmp/prod-stack-smoke
          cp docker-compose.yml /tmp/prod-stack-smoke/docker-compose.yml
          cd /tmp/prod-stack-smoke
          sed -i 's/pull_policy: always/pull_policy: never/' docker-compose.yml
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:38180/api/health >/dev/null \
               && curl -skf https://127.0.0.1:38443/api/health >/dev/null; then
              echo "Production stack healthy on both HTTP (38180) and HTTPS (38443)!"
              docker compose ps -a
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          echo "Production stack failed to become healthy within 60s!"
          docker compose ps -a
          docker compose logs
          docker compose down -v
          exit 1

  image:
    name: Docker image
    needs: [tests, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # QEMU lets the amd64 runner build the arm64 half (Raspberry Pi and other ARM servers).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Pull requests only check that the image builds; nothing is published.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
      - name: Base image digest
        id: base
        run: echo "digest=$(docker buildx imagetools inspect ${{ env.BASE_IMAGE }} --format '{{json .Manifest.Digest}}' | tr -d '\"')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            unwrapped.base-digest=${{ steps.base.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
