name: Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Run full security and RLS test suite
        run: |
          npm run build
          npm test

  smoke-test:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Smoke-test production docker-compose.yml in an empty directory
        run: |
          docker build --target prod -t ghcr.io/jray222/unwrapped:latest .
          mkdir -p /tmp/prod-stack-smoke
          cp docker-compose.yml /tmp/prod-stack-smoke/docker-compose.yml
          cd /tmp/prod-stack-smoke
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:38180/api/health >/dev/null \
               && curl -skf https://127.0.0.1:38443/api/health >/dev/null; then
              echo "Production stack healthy on both HTTP (38180) and HTTPS (38443)!"
              docker compose ps -a
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          echo "Production stack failed to become healthy within 60s!"
          docker compose ps -a
          docker compose logs
          docker compose down -v
          exit 1

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: [smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
